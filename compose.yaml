# BLP Workbench (production). Copy this file and .env.example (as .env) into the install folder
# (e.g. /docker/blp-workbench), then: docker compose pull && docker compose up -d
# See docs/DOCKER.md.
services:
  app:
    image: ghcr.io/brooksidelaser/blp-workbench:${BLP_VERSION:-latest}
    # One name per instance on this machine (CONTAINER_NAME in .env).
    container_name: ${CONTAINER_NAME:-blp-workbench}
    init: true
    restart: unless-stopped
    # The user the app runs as must own ./data on the host. Default: the image's own user
    # (1000:1000); set APP_UID / APP_GID in .env to use another host user.
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    env_file: .env
    environment:
      # The database below, as its owner (migrations), through its socket (it has no network);
      # the app makes its own role from it.
      DATABASE_MIGRATE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@localhost/workbench?host=/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-7080}:7080' # HTTP (port 80 for Let's Encrypt)
      - '${APP_HTTPS_PORT:-7443}:7443' # HTTPS (port 443), once Settings › HTTPS has a certificate
    volumes:
      - ./data:/data
      - db-socket:/var/run/postgresql
  # The database (PostgreSQL), reachable only by the app: it has no network at all and listens
  # on no port, only on a Unix socket in the db-socket volume, which only the app mounts. The
  # app's API is the way in. Its files are in the "db" volume; the app's backups
  # (Admin › Backup & Restore) hold all of its data too.
  db:
    image: postgres:18
    container_name: ${CONTAINER_NAME:-blp-workbench}-db
    restart: unless-stopped
    network_mode: none
    command: ['postgres', '-c', 'listen_addresses=']
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: workbench
      # Socket connections need a password too (the image trusts them by default).
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d workbench']
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db:/var/lib/postgresql
      - db-socket:/var/run/postgresql
volumes:
  db:
  db-socket:
