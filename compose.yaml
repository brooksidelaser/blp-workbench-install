# BLP Workbench (production). Copy this file and .env.example (as .env) into the install folder
# (e.g. /docker/blp-workbench), then: docker compose pull && docker compose up -d
# See docs/DOCKER.md.
services:
  app:
    image: ${BLP_IMAGE:-ghcr.io/brooksidelaser/blp-workbench}:${BLP_VERSION:-latest}
    # One name per instance on this machine (CONTAINER_NAME in .env).
    container_name: ${CONTAINER_NAME:-blp-workbench}
    init: true
    restart: unless-stopped
    # The user the app runs as must own ./data on the host. Default: the image's own user
    # (1000:1000); set APP_UID / APP_GID in .env to use another host user.
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    env_file: .env
    environment:
      # The database below, as its owner (migrations), through its socket (it has no network);
      # the app makes its own role from it.
      DATABASE_MIGRATE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@localhost/workbench?host=/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-7080}:7080' # HTTP (port 80 for Let's Encrypt)
      - '${APP_HTTPS_PORT:-7443}:7443' # HTTPS (port 443), once Settings › HTTPS has a certificate
    volumes:
      - ./data:/data
      - db-socket:/var/run/postgresql
  # The database (PostgreSQL), reachable only by the app: it has no network at all and listens
  # on no port, only on a Unix socket in the db-socket volume, which only the app mounts. The
  # app's API is the way in. Its files are in the "db" volume; the app's backups
  # (Admin › Backup & Restore) hold all of its data too.
  db:
    image: postgres:18
    container_name: ${CONTAINER_NAME:-blp-workbench}-db
    restart: unless-stopped
    network_mode: none
    command: ['postgres', '-c', 'listen_addresses=']
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: workbench
      # Socket connections need a password too (the image trusts them by default).
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d workbench']
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db:/var/lib/postgresql
      - db-socket:/var/run/postgresql
  # The updater (optional; COMPOSE_PROFILES=updater in .env turns it on): carries out the updates
  # and restarts started in Admin › Updates, and gives Brookside's staff the app's and the
  # database's logs (and, when you allow it, a shell) during support access. It has the Docker
  # socket, which means full control of Docker on this machine, so it publishes no port, takes
  # requests only from the app (through files and a socket in ./data/updates that only the app's
  # user can open), accepts nothing but a release to update to (checked against blpworkbench.com's
  # digest), a restart, and logs or a shell of this install's app and db containers, and its code
  # is in its image (the release's -updater image). It sees the install folder at its own path
  # (INSTALL_DIR) to edit BLP_VERSION in .env, and signs in to the image registry with this
  # machine's Docker login (DOCKER_CONFIG_DIR, read-only).
  updater:
    image: ${BLP_IMAGE:-ghcr.io/brooksidelaser/blp-workbench}:${BLP_VERSION:-latest}-updater
    container_name: ${CONTAINER_NAME:-blp-workbench}-updater
    profiles: [updater]
    init: true
    restart: unless-stopped
    environment:
      # The mounted socket, whatever context the machine's Docker login names.
      DOCKER_HOST: unix:///var/run/docker.sock
      # Without INSTALL_DIR, the updater stops and says so.
      INSTALL_DIR: ${INSTALL_DIR:-}
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      BLP_IMAGE: ${BLP_IMAGE:-ghcr.io/brooksidelaser/blp-workbench}
      DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
    volumes:
      # DOCKER_SOCKET: rootless Docker's socket instead (e.g. /run/user/1000/docker.sock).
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${INSTALL_DIR:-.}:${INSTALL_DIR:-/install}
      - type: bind
        source: ${DOCKER_CONFIG_DIR:-/root/.docker}/config.json
        target: /root/.docker/config.json
        read_only: true
        bind:
          create_host_path: false
volumes:
  db:
  db-socket:
